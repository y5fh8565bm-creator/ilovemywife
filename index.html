<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#fff;
    font-family:Georgia, serif;
}

.container{
    text-align:center;
    animation:fade 1.8s ease;
}

h1{
    font-weight:normal;
    font-size:34px;
    cursor:pointer;
}

p{
    color:#777;
    margin-top:10px;
    font-size:16px;
}

.heart{
    animation:beat 1.4s infinite;
    display:inline-block;
}

@keyframes fade{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
}
</style>
</head>

<body>

<div class="container">
<h1 onclick="love()">
i love my wife riri <span class="heart">💕</span>
</h1>

<p>every version of you.</p>
</div>

<script>
function love(){
    alert("Hi wife. I love you more than words can say. 🤍");
}
</script>

</body>
</html>
